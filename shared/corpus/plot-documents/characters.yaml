  - name: Felicitar
    aliases: ["Love"]
    faction: Zealan gods
    role: "Zealan god of Joy/Love"
    description: "One of three gods imprisoned in the Shrine by the Titans."
    art_notes: "Zealan God 1/2/3 — speaking (from Ancient Ones' mesh/skeleton) and encased in resin"
    sources:
